name: daysnap
services:
  backend:
    build: ./backend
    ports: ["11600:11600"]
    volumes:
      - daysnap_data:/data
      - ./fixtures:/fixtures:ro
    environment:
      数据目录: /data
      夹具目录: /fixtures
  frontend:
    build: ./frontend
    ports: ["6600:80"]
    depends_on: [backend]
volumes:
  daysnap_data:
